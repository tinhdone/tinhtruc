<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập & Đăng Ký - Thế Giới Di Động</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="top-banner-strip">
        🔥 Siêu hội Laptop & Điện thoại - Giảm ngay đến 50% + Trả góp 0% qua MB Bank
    </div>

    <header>
        <div class="container header-wrap">
            <a href="index.html" class="logo-tgdd">
                thegioididong <span>.com</span>
            </a>
            <a href="index.html" class="head-link-item">
                <i class="fa-solid fa-house"></i> Trang chủ
            </a>
        </div>
    </header>

    <main class="container" style="margin-top: 30px; margin-bottom: 40px; max-width: 950px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            
            <div style="background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 25px;">
                <h3 style="color: #d0021b; font-size: 16px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #f1f1f1; padding-bottom: 8px;">
                    <i class="fa-solid fa-right-to-bracket"></i> ĐĂNG NHẬP HỆ THỐNG
                </h3>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Tên đăng nhập / Email</label>
                        <input type="text" id="loginUser" required placeholder="Nhập admin hoặc tên tài khoản...">
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" id="loginPass" required placeholder="••••••">
                    </div>
                    <button type="submit" class="btn-them-gio" style="width: 100%; padding: 10px; font-size: 14px; margin-top: 10px;">
                        ĐĂNG NHẬP
                    </button>
                </form>

                
            </div>

            <div style="background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 25px;">
                <h3 style="color: #288ad6; font-size: 16px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #f1f1f1; padding-bottom: 8px;">
                    <i class="fa-solid fa-user-plus"></i> ĐĂNG KÝ TÀI KHOẢN MỚI
                </h3>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Họ và tên</label>
                        <input type="text" id="regName" required placeholder="Nguyễn Văn A">
                    </div>
                    <div class="form-group">
                        <label>Tên đăng nhập</label>
                        <input type="text" id="regUser" required placeholder="Tên đăng nhập mới...">
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" id="regPass" required placeholder="••••••">
                    </div>
                    <button type="submit" class="btn-so-sanh" style="width: 100%; padding: 10px; font-size: 14px; margin-top: 10px; background: #288ad6; color: #fff; border: none;">
                        TẠO TÀI KHOẢN MỚI
                    </button>
                </form>
            </div>

        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom-bar">
                © 2026. Công ty cổ phần Thế Giới Di Động. Hệ thống xác thực tài khoản.
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
